<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Milk Hunt — Mama's Birthday Game</title>
<style>
  :root{--ink:#18233d;--cream:#fff4df;--pink:#f36c91;--blue:#79c8ed;--green:#75d69a;--yellow:#ffd66b;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18233d;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{width:min(100vw,560px);height:100dvh;max-height:1000px;position:relative;background:#9bdcf2;overflow:hidden}
  canvas{width:100%;height:100%;display:block;touch-action:none}
  #sound{position:absolute;right:12px;top:12px;z-index:5;border:3px solid var(--ink);background:var(--cream);border-radius:12px;padding:7px 10px;font-size:16px}
  #hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:4;background:#fff8e9dd;border:2px solid var(--ink);border-radius:12px;padding:7px 12px;font-weight:800;font-size:12px;white-space:nowrap}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <button id="sound" aria-label="Toggle sound">🔊</button>
  <div id="hint">Best played in portrait mode</div>
</div>
<script>
(() => {
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
const soundBtn=document.getElementById('sound'), hint=document.getElementById('hint');
let W=0,H=0,dpr=1, state='menu', level=1, score=0, best=0, audioOn=true, audioCtx=null;
let t=0,last=performance.now(), raf, particles=[], bubbles=[], toast=null;

const C={ink:'#18233d',cream:'#fff4df',pink:'#f36c91',pink2:'#ffb2c6',blue:'#79c8ed',blue2:'#bce9fa',green:'#75d69a',yellow:'#ffd66b',orange:'#ffad68',purple:'#b69af4',red:'#ee5d68',white:'#fff'};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize); resize();

function roundRect(x,y,w,h,r,fill,stroke=C.ink,lw=3){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}
function text(s,x,y,size=20,fill=C.ink,align='center',weight=800){ctx.font=`${weight} ${size}px system-ui,-apple-system,Segoe UI,sans-serif`;ctx.fillStyle=fill;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function circle(x,y,r,fill,stroke=C.ink,lw=3){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}
function line(x1,y1,x2,y2,w,fill=C.ink){ctx.lineWidth=w;ctx.strokeStyle=fill;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function rnd(a,b){return a+Math.random()*(b-a)}
function beep(freq=440,dur=.06,type='square',vol=.035){
 if(!audioOn)return;
 try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}
}
function burst(x,y,n=12,col=C.yellow){
 for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-130,130),vy:rnd(-170,40),life:rnd(.35,.8),age:0,c:col,s:rnd(2,5)})
}
function updateParticles(dt){particles.forEach(p=>{p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt});particles=particles.filter(p=>p.age<p.life)}
function drawParticles(){particles.forEach(p=>{ctx.globalAlpha=1-p.age/p.life;circle(p.x,p.y,p.s,p.c,null,0)});ctx.globalAlpha=1}
function toastMsg(s,sub='',color=C.cream){
 toast={s,sub,age:0,color}; beep(660,.05)
}
function drawToast(){
 if(!toast)return; toast.age+=1/60; if(toast.age>1.1){toast=null;return}
 const a=toast.age<.15?toast.age/.15:toast.age>.9?(1-toast.age)/.2:1;ctx.globalAlpha=a;
 roundRect(W*.08,H*.39,W*.84,92,18,toast.color);
 text(toast.s,W/2,H*.39+30,20,C.ink);
 if(toast.sub)text(toast.sub,W/2,H*.39+60,14,C.ink, 'center',700);
 ctx.globalAlpha=1;
}
function header(title,timeLeft,patience=null){
 roundRect(12,12,W-24,54,15,C.cream);
 text('Ⅱ',34,39,18,C.ink);
 text(title,W/2,31,15,C.ink);
 if(timeLeft!=null){text(`⏱ ${Math.ceil(timeLeft)}s`,W-48,31,13,C.ink)}
 if(patience!=null){
   text("MAMA'S PATIENCE",W*.18,56,9,C.ink,'left',900);
   roundRect(W*.34,49,W*.46,11,6,'#d8e4ef',null,0);
   const p=clamp(patience,0,1);roundRect(W*.34,49,W*.46*p,11,6,p>.35?C.green:C.red,null,0);
 }
}
function drawBaby(x,y,scale=1,front=true){
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
 // body
 roundRect(-24,15,48,45,17,C.blue,C.ink,3);
 circle(0,0,25,'#d99468',C.ink,3);
 circle(-9,-3,3,C.ink,null);circle(9,-3,3,C.ink,null);
 ctx.strokeStyle=C.ink;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,5,8,0.15,Math.PI-.15);ctx.stroke();
 ctx.beginPath();ctx.moveTo(-2,-24);ctx.quadraticCurveTo(2,-36,9,-27);ctx.stroke();
 ctx.restore();
}
function drawMama(y){
 // deliberately abstract/cartoonish upper body
 ctx.save();ctx.translate(0,y);
 ctx.fillStyle='#d99468';ctx.strokeStyle=C.ink;ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(W*.16,0);ctx.quadraticCurveTo(W*.5,-35,W*.84,0);ctx.lineTo(W*.93,H*.62);ctx.lineTo(W*.07,H*.62);ctx.closePath();ctx.fill();ctx.stroke();
 // hair
 ctx.fillStyle='#3b2926';ctx.beginPath();ctx.moveTo(W*.14,10);ctx.quadraticCurveTo(W*.18,-60,W*.5,-65);ctx.quadraticCurveTo(W*.82,-60,W*.86,10);ctx.lineTo(W*.78,55);ctx.lineTo(W*.22,55);ctx.closePath();ctx.fill();ctx.stroke();
 // top / stylised chest area, targets sit over this
 ctx.fillStyle=C.purple;ctx.beginPath();ctx.moveTo(W*.20,25);ctx.quadraticCurveTo(W*.5,-5,W*.80,25);ctx.lineTo(W*.86,H*.62);ctx.lineTo(W*.14,H*.62);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.restore();
}
function target(x,y,r,kind='milk'){
 const pulse=1+Math.sin(t*8)*.05;
 ctx.save();ctx.translate(x,y);ctx.scale(pulse,pulse);
 circle(0,0,r+8,'#fff5c7',C.ink,3);circle(0,0,r,C.pink2,C.pink,4);
 if(kind==='milk'){text('🍼',0,1,r*.75)}
 else if(kind==='soother'){text('🍼',0,1,r*.75);text('×',r*.48,-r*.52,18,C.red)}
 else{text('×',0,1,r*.75,C.red)}
 ctx.restore();
}

let L1={time:0,patience:1,target:null,kind:'milk',hits:0,misses:0,stage:1,bonus:false};
function startL1(){level=1;state='l1';score=0;L1={time:0,patience:1,target:null,kind:'milk',hits:0,misses:0,stage:1,bonus:false};newTarget();}
function newTarget(){
 const stage=L1.stage;
 const r=stage===1?34:stage===2?30:27;
 L1.target={x:rnd(W*.22,W*.78),y:rnd(H*.24,H*.56),r,life:stage===1?1.5:stage===2?.95:.55};
 const roll=Math.random();
 L1.kind=(stage>=2 && roll<.18)?'soother':(stage>=2&&roll<.27)?'shoulder':'milk';
 if(L1.kind==='milk')L1.target.life*=1;
}
function l1(dt){
 const total=65; L1.time+=dt;
 const elapsed=L1.time;
 L1.stage=elapsed<20?1:elapsed<45?2:3;
 L1.patience=clamp(1-(L1.misses*0.045),0,1);
 if(!L1.target)newTarget();
 L1.target.life-=dt;
 if(L1.target.life<=0){L1.misses++;newTarget()}
 header(L1.stage===1?"STAGE 1: WHERE'S THE MILK?":L1.stage===2?"STAGE 2: GETTING DEMANDING":"STAGE 3: CLUSTER FEED",total-elapsed,L1.patience);
 drawMama(H*.20);
 // blanket / baby
 ctx.fillStyle='#d8edf5';ctx.fillRect(0,H*.60,W,H*.40);
 for(let x=0;x<W;x+=35)text('✦',x+15,H*.75+(x%70),9,'#b7d8e8');
 target(L1.target.x,L1.target.y,L1.target.r,L1.kind);
 drawBaby(W/2,H*.78,.95);
 if(elapsed>47 && !L1.bonus && Math.random()<.004){L1.bonus=true;L1.target={x:rnd(W*.2,W*.8),y:rnd(H*.23,H*.52),r:43,life:2,kind:'bonus'};toastMsg('LET-DOWN BONUS!','+500 if you catch it');}
 if(L1.target?.kind==='bonus') {circle(L1.target.x,L1.target.y,L1.target.r+13,'#fff3a6',null);text('🍼',L1.target.x,L1.target.y,34);text('+500',L1.target.x,L1.target.y+50,20,C.ink)}
 if(elapsed>19.5&&elapsed<20)toastMsg("MAMA HAS MOVED",'Try again...');
 if(elapsed>44&&elapsed<44.3)toastMsg('CLUSTER FEEDING MODE!','Must. Have. Milk.');
 if(elapsed>=total){state='l1end';}
 drawParticles();drawToast();
}
function hitL1(x,y){
 if(state!=='l1'||!L1.target)return;
 const q=L1.target,d=Math.hypot(x-q.x,y-q.y);
 if(d<=q.r+12){
   if(q.kind==='milk'){L1.hits++;score+=100;burst(q.x,q.y);toastMsg('GOOD LATCH!','+100');beep(760,.08,'square',.05)}
   else if(q.kind==='bonus'){score+=500;burst(q.x,q.y,24,C.yellow);toastMsg('LET-DOWN BONUS!','+500');beep(980,.12,'sine',.05);L1.bonus=true}
   else {L1.misses++;score=Math.max(0,score-50);burst(q.x,q.y,8,C.red);toastMsg(q.kind==='soother'?'SOOTHER!':'THAT’S A SHOULDER!','Not milk!');beep(180,.1,'sawtooth',.04)}
   newTarget();
 }
}

let L2={time:0,x:.5,comfort:1,shadeX:.5,shadeW:.24,nap:false,napTime:0,hit:0};
function startL2(){level=2;state='l2';L2={time:0,x:.5,comfort:1,shadeX:.5,shadeW:.25,nap:false,napTime:0,hit:0};}
function l2(dt){
 const total=70;L2.time+=dt;
 if(!L2.nap){
   L2.shadeX=.5+Math.sin(L2.time*.7)*.27+Math.sin(L2.time*1.8)*.08;
   const dx=Math.abs(L2.x-L2.shadeX);
   if(dx>L2.shadeW*.65)L2.comfort-=dt*.055;else L2.comfort=Math.min(1,L2.comfort+dt*.018);
   if(L2.time>43)L2.shadeW=.18;
   if(L2.comfort<.22){L2.nap=true;L2.napTime=0;toastMsg('BABY NEEDS A BREAK','Find some shade!')}
 } else {
   L2.napTime+=dt;
   if(L2.napTime>2.8 && L2.napTime<3.0)toastMsg('BUGGY NAP ACHIEVED','Don’t wake the baby...');
 }
 header('LEVEL 2: KEEP BABY IN THE SHADE',total-L2.time);
 // sky
 ctx.fillStyle='#9bdcf2';ctx.fillRect(0,0,W,H);
 text('☀️',W*(.18+.64*(.5+.5*Math.sin(L2.time*.45))),H*.17,50);
 // path
 ctx.fillStyle='#e8d4ad';ctx.fillRect(0,H*.25,W,H*.75);
 for(let i=0;i<10;i++){ctx.fillStyle='#c7b188';ctx.fillRect((i*83+((L2.time*70)%83))-40,H*.34+i*70,48,5)}
 // shade patches
 const sx=L2.shadeX*W, sw=L2.shadeW*W;
 ctx.fillStyle='rgba(82,130,92,.48)';ctx.fillRect(sx-sw/2,H*.25,sw,H*.75);
 for(let yy=H*.31;yy<H;yy+=95){circle(sx+Math.sin(yy)*sw*.3,yy,34,'rgba(70,120,70,.35)',null)}
 // obstacles
 const obs=[{x:.18,y:.58,e:'🐕'},{x:.78,y:.40,e:'🪑'},{x:.37,y:.78,e:'🚧'},{x:.87,y:.73,e:'🧍'}];
 obs.forEach(o=>text(o.e,o.x*W,o.y*H,30));
 // buggy
 const bx=L2.x*W, by=H*.72;
 if(!L2.nap){drawBaby(bx,by,.58);roundRect(bx-43,by-35,86,35,15,C.pink2,C.ink,3);circle(bx-30,by+8,8,C.ink);circle(bx+30,by+8,8,C.ink)}
 else {roundRect(bx-44,by-36,88,38,15,C.blue2,C.ink,3);text('💤',bx,by-17,22)}
 // comfort meter
 roundRect(20,H*.90,W-40,34,14,C.cream);
 text('BABY COMFORT',32,H*.917,10,C.ink,'left',900);
 roundRect(120,H*.905,W-160,12,6,'#d8e4ef',null,0);
 roundRect(120,H*.905,(W-160)*clamp(L2.comfort,0,1),12,6,L2.comfort>.35?C.green:C.red,null,0);
 if(L2.time>18&&L2.time<18.3)toastMsg('THE SUN IS FOLLOWING US','Of course it is.');
 if(L2.time>37&&L2.time<37.3)toastMsg('WHY IS THE SUN FOLLOWING US?','This feels personal.');
 if(L2.time>55&&L2.time<55.3)toastMsg('IRISH SUMMER','Cloud cover: temporary.');
 drawParticles();drawToast();
 if(L2.time>=total){state='l2end';}
}
function moveL2(x){if(state==='l2'&&!L2.nap)L2.x=clamp(x/W,.08,.92)}

let L3={time:0,items:[],collected:0,started:false,finished:false};
const items=[
 ['nappies','🧷'],['wipes','🧻'],['soother','🍼'],['muslin','🧣'],['spare clothes','👕'],
 ['bottle','🍼'],['phone','📱'],['keys','🔑'],['wallet','👛'],['something else','❓']
];
function startL3(){
 level=3;state='l3';score=0;L3={time:0,items:items.map((it,i)=>({name:it[0],icon:it[1],got:false,x:rnd(.12,.88),y:rnd(.30,.78)})),collected:0,started:true,finished:false};
}
function l3(dt){
 const total=65;L3.time+=dt;
 header('LEVEL 3: OPERATION — LEAVE THE HOUSE',total-L3.time);
 ctx.fillStyle='#f6d8b0';ctx.fillRect(0,0,W,H);
 // house floor
 ctx.fillStyle='#d9c19e';ctx.fillRect(0,H*.25,W,H*.75);
 text('🚪',W*.91,H*.18,60);text('👜',W*.50,H*.83,48);
 text('PACK THE BAG',W/2,H*.20,22,C.ink);
 // items
 L3.items.forEach((it,i)=>{
   if(!it.got){
     roundRect(it.x*W-30,it.y*H-30,60,60,16,C.cream,C.ink,3);
     text(it.icon,it.x*W,it.y*H,29);
     text(it.name,it.x*W,it.y*H+43,9,C.ink,'center',800);
   } else {text('✓',it.x*W,it.y*H,24,C.green)}
 });
 // baby
 drawBaby(W*.15,H*.72,.72);
 text('👩🏻‍🦱',W*.15,H*.61,38);
 text(`ITEMS: ${L3.collected}/${L3.items.length}`,W*.5,H*.92,15,C.ink);
 if(L3.collected===L3.items.length && !L3.finished){L3.finished=true;toastMsg('READY!','Let’s go!');}
 if(L3.finished){
   roundRect(W*.15,H*.39,W*.70,110,20,C.green,C.ink,3);
   text('YOU HAVE LEFT THE HOUSE!',W*.5,H*.43,17,C.ink);
   text('...wait.',W*.5,H*.50,22,C.ink);
   text('BABY HAS DONE A POO.',W*.5,H*.57,16,C.red);
   text('BACK INSIDE.',W*.5,H*.63,16,C.ink);
 }
 if(L3.time>12&&L3.time<12.3)toastMsg('WE FORGOT SOMETHING','Obviously.');
 if(L3.time>30&&L3.time<30.3)toastMsg('SOOTHER CHECK','Where is it?!');
 if(L3.time>48&&L3.time<48.3)toastMsg('BABY HAS DONE A POO','Back to the changing table.');
 drawParticles();drawToast();
 if(L3.time>=total)state='l3end';
}
function hitL3(x,y){
 if(state!=='l3'||L3.finished)return;
 for(const it of L3.items){
   if(!it.got && Math.hypot(x-it.x*W,y-it.y*H)<46){
     it.got=true;L3.collected++;score+=100;burst(it.x*W,it.y*H);beep(620,.05);
     if(L3.collected===L3.items.length){score+=500;beep(920,.12,'sine',.05)}
     return;
   }
 }
}

function button(x,y,w,h,label,fill=C.pink){
 roundRect(x,y,w,h,18,fill,C.ink,4);text(label,x+w/2,y+h/2,18,C.white);
}
function menu(){
 ctx.fillStyle='#9bdcf2';ctx.fillRect(0,0,W,H);
 for(let i=0;i<18;i++)text(i%2?'♡':'✦',rnd(20,W-20),rnd(20,H-20),rnd(12,24),i%2?C.pink:C.white);
 text('MILK',W/2,H*.18,54,C.cream,C.center,950);text('HUNT',W/2,H*.25,54,C.yellow,C.center,950);
 text("THE MOTHER OF ALL",W/2,H*.34,18,C.ink);text("BOSS FIGHTS",W/2,H*.38,18,C.ink);
 roundRect(W*.12,H*.46,W*.76,130,20,C.cream,C.ink,4);
 text('A tiny birthday game',W/2,H*.50,18,C.ink);
 text('about surviving',W/2,H*.55,17,C.ink);
 text('the first year of parenthood.',W/2,H*.60,17,C.ink);
 button(W*.16,H*.70,W*.68,62,'TAP TO PLAY');
 text('3 ridiculous levels • made with ❤️ for Mama',W/2,H*.82,12,C.ink);
}
function endScreen(title,lines,nextLabel,nextFn){
 ctx.fillStyle='#18233d';ctx.fillRect(0,0,W,H);
 text(title,W/2,H*.18,31,C.yellow);
 lines.forEach((s,i)=>text(s,W/2,H*(.30+i*.07),16,C.cream));
 button(W*.12,H*.68,W*.76,60,nextLabel,C.pink);
 text('Tip: turn sound on for maximum arcade nonsense.',W/2,H*.80,11,C.cream);
 window._next=nextFn;
}
function finalScreen(){
 ctx.fillStyle='#18233d';ctx.fillRect(0,0,W,H);
 text('YOU DID IT!',W/2,H*.17,36,C.yellow);
 text('You survived:',W/2,H*.28,19,C.cream);
 text('🍼 The milk hunt',W/2,H*.36,18,C.cream);
 text('☀️ The buggy sun battle',W/2,H*.43,18,C.cream);
 text('🚪 Leaving the house',W/2,H*.50,18,C.cream);
 roundRect(W*.10,H*.58,W*.80,135,20,C.cream,C.pink,4);
 text('And somehow,',W/2,H*.62,17,C.ink);
 text('you made it look easy.',W/2,H*.67,21,C.ink);
 text('❤️ Happy Birthday, Mama ❤️',W/2,H*.76,21,C.pink);
 text('You’re doing an amazing job.',W/2,H*.83,15,C.cream);
}
function render(){
 ctx.clearRect(0,0,W,H);
 if(state==='menu')menu();
 else if(state==='l1')l1((performance.now()-last)/1000);
 else if(state==='l1end')endScreen('LEVEL 1 COMPLETE',[
   `MILK ACQUIRED: ${L1.hits+Math.floor(score/100)}`,
   `SUCCESSFUL LATCHES: ${L1.hits}`,
   `FALSE ALARMS: ${L1.misses}`,
   `MAMA'S PATIENCE: ${Math.max(2,Math.round(L1.patience*100))}%`,
   '🏆 RANK: MILK MONSTER'
 ],'LEVEL 2 → SHADE BATTLE',startL2);
 else if(state==='l2')l2((performance.now()-last)/1000);
 else if(state==='l2end')endScreen('LEVEL 2 COMPLETE',[
   `TIME IN SHADE: ${Math.round(L2.comfort*100+35)}%`,
   `BABY WOKEN: ${L2.nap?1:0}`,
   '🏆 RANK: SHADE MASTER',
   '“An unnecessarily stressful walk in the park.”'
 ],'LEVEL 3 → LEAVE THE HOUSE',startL3);
 else if(state==='l3')l3((performance.now()-last)/1000);
 else if(state==='l3end')endScreen('GAME COMPLETE',[
   'ITEMS PACKED: 10/10',
   'FORGOTTEN ITEMS: SOMEHOW 0',
   'BUGGY NAPS: 1',
   '🏆 RANK: ELITE PARENT'
 ],'❤️ BIRTHDAY FINALE',()=>state='final');
 else if(state==='final')finalScreen();
 updateParticles((performance.now()-last)/1000);
 last=performance.now();
 raf=requestAnimationFrame(render);
}
function pointer(e){
 const r=canvas.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;
 if(state==='l1')hitL1(x,y);
 else if(state==='l2')moveL2(x);
 else if(state==='l3')hitL3(x,y);
 else if(state==='menu' && y>H*.68){beep(520,.08);startL1()}
 else if((state==='l1end'||state==='l2end'||state==='l3end') && y>H*.64){beep(520,.08);if(window._next)window._next()}
 else if(state==='final'){startL1()}
}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();pointer(e)});
canvas.addEventListener('pointermove',e=>{if(state==='l2'){e.preventDefault();moveL2(e.clientX-canvas.getBoundingClientRect().left)}});

soundBtn.onclick=()=>{audioOn=!audioOn;soundBtn.textContent=audioOn?'🔊':'🔇';if(audioOn)beep(660,.05)};
hint.onclick=()=>hint.style.display='none';
render();
})();
</script>
</body>
</html>
